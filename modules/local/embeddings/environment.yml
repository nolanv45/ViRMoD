# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.2.2
  - umap-learn=0.5.6
  - pip=26.1.2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1
      - fair-esm==2.0.0